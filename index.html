<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelulusan SMA Islam Pujer</title>

<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        font-family: Arial, sans-serif;
        color: white;
        background: linear-gradient(180deg, #5fb3ff, #003366);
        min-height: 100vh;
    }

    .container {
        min-height: 100vh; /* full layar */
        text-align: center;
        padding: 20px;
    }

    /* HEADER */
    .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .header img {
        width: 70px;
        height: 70px;
        object-fit: contain;
    }

    .header-text {
        text-align: left;
    }

    .header-text h2 {
        margin: 0;
        font-size: 20px;
    }

    .header-text p {
        margin: 0;
        font-size: 12px;
        color: yellow;
    }

    /* GARIS */
    .line {
        width: 100%;
        max-width: 600px;
        height: 3px;
        background: yellow;
        margin: 15px auto;
    }

    /* JUDUL */
    .title {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 30px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
    }

    /* BUTTON */
    .btn {
        padding: 12px 25px;
        background: yellow;
        color: black;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        opacity: 0;
        transition: 2s;
    }

    .btn:hover {
        background: orange;
    }

    /* BOX PASSWORD */
    .password-box {
        margin-top: 40px;
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        max-width: 300px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
    }

    .password-box input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: none;
        border-radius: 5px;
    }

    .password-box button {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background: yellow;
        font-weight: bold;
        cursor: pointer;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
        .header {
            flex-direction: column;
        }
        .header-text {
            text-align: center;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <img src="https://drive.google.com/uc?export=preview&id=1EYIyTa89afvi2pwcGB1HW_Vj6Zs60c0E" alt="Logo Sekolah">
        <div class="header-text">
            <h2>SMA ISLAM PUJER BONDOWOSO</h2>
            <p>Alamat Sekolah Anda</p>
        </div>
    </div>

    <div class="line"></div>

    <!-- JUDUL -->
    <div class="title">
        PENETAPAN KELULUSAN PESERTA DIDIK KELAS XII<br>
        SMA ISLAM PUJER 
        TAHUN PELAJARAN 2025/2026
    </div>

    <!-- TOMBOL DRIVE -->
    <a href="https://drive.google.com/file/d/1qYSvq8OMVmB2WG43YW7nKyIFMYPERifc/preview" target="_blank">
        <button class="btn" id="btnMasuk">Klik di sini</button>
    </a>

    <!-- PASSWORD BOX -->
    <div class="password-box">
        <p>Masukkan Password</p>
        <input type="password" id="pw" placeholder="Password">
        <button onclick="cek()">Cek Kelulusan</button>
    </div>

</div>

<script>
    // Animasi tombol muncul
    window.onload = function() {
        setTimeout(() => {
            document.getElementById("btnMasuk").style.opacity = 1;
        }, 1500);
    };

    function cek() {
        var pw = document.getElementById("pw").value;

        if (pw === "12345") {
            window.open("https://drive.google.com/file/d/1imdi1JguSyygAmArkpJG3-QMwun3sEei/preview", "_blank");
        } else {
            alert("Password salah!");
        }
    }
</script>

</body>
</html>
