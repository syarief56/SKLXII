<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dokumen</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* SPLASH SCREEN */
        #splash {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: url('sekolah.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        #judul {
            font-size: 30px;
            opacity: 0;
            transition: opacity 2s;
        }

        #masukBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            display: none;
            cursor: pointer;
        }

        /* HALAMAN UTAMA */
        #mainContent {
            display: none;
            padding: 20px;
        }
    </style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
    <h1 id="judul">SMA ISLAM PUJER BONDOWOSO</h1>
    <button id="masukBtn" onclick="masuk()">Masuk</button>
</div>

<!-- KONTEN UTAMA -->
<div id="mainContent">

    <h2>Dokumen (Halaman 1 & 2)</h2>

    <iframe src="https://drive.google.com/file/d/1SWHxVFQPLcS9FNRcWrCEVqhWqPlme4h7/preview" width="100%" height="500px"></iframe>

    <hr>

    <h3>Akses Halaman 3</h3>

    <input type="password" id="password" placeholder="Masukkan password">
    <button onclick="cekPassword()">Buka</button>

    <div id="privateContent" style="display:none;">
        <h4>Halaman 3</h4>
        <iframe src="file_private.pdf" width="100%" height="500px"></iframe>
    </div>

</div>

<script>
    // Animasi teks muncul
    window.onload = function() {
        setTimeout(() => {
            document.getElementById("judul").style.opacity = 1;
        }, 500);

        setTimeout(() => {
            document.getElementById("masukBtn").style.display = "block";
        }, 2500);
    };

    function masuk() {
        document.getElementById("splash").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
    }

    function cekPassword() {
        var pw = document.getElementById("password").value;

        if (pw === "12345") {
            document.getElementById("privateContent").style.display = "block";
        } else {
            alert("Password salah!");
        }
    }
</script>

</body>
</html>
